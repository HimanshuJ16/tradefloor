name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Host files match rules/, roles/ and tools/adapters.py
        run: python tools/build.py --check

      - name: Tests (offline, synthetic data)
        run: uv run --locked --project server --group dev pytest -q tests server/tests
      - name: Undefined names and syntax lint
        run: uv run --locked --project server --group dev ruff check --select F,E9 server/src/tradefloor

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv build --project server --out-dir dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend syntax and offline application logic
        run: |
          node --check server/src/tradefloor/assets/app.js
          node --check server/src/tradefloor/assets/workspace.js
          node --check server/src/tradefloor/assets/workspace-model.js
          node --check server/src/tradefloor/assets/desk.js
          node --check server/src/tradefloor/assets/research-map-model.js
          node --check server/src/tradefloor/assets/research-map.js
          node --check server/src/tradefloor/assets/source-view.js
          node --check server/src/tradefloor/assets/sources.js
          node --test tests/frontend.test.cjs
          node --test tests/workspace-model.test.cjs
          node --test tests/research-map.test.cjs
          node --test tests/sources.test.cjs
      - name: Install built wheel and verify assets
        shell: bash
        run: |
          wheel=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$wheel" python -c "from tradefloor import cli,demo; assert 'research_library' in cli.TOOLS; assert 'research_report' in cli.TOOLS; html = demo.workspace_document(); assert 'A thesis is a starting point.' in html; assert 'TradefloorView' in html; assert 'desk-session-meta' in html; assert 'TradefloorMapModel' in html; assert 'TradefloorSources' in html; assert '/*DESK*/' not in html; assert '/*RESEARCH_MAP*/' not in html; assert '/*SOURCES*/' not in html; print('wheel verified')"
          uv run --locked --project server python tools/smoke_mcp.py "$wheel"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
