<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="640" rx="24" fill="#FFFFFF"/>

  <!-- Universe -->
  <rect x="20" y="20" width="240" height="600" rx="22" fill="#FFF4DE" stroke="#F5B942" stroke-width="2.5"/>
  <text x="140" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#92400E">Market universe</text>
  <text x="140" y="78" text-anchor="middle" font-size="13" fill="#92400E">no API keys</text>
  <g font-size="13" fill="#374151">
    <rect x="38" y="98" width="204" height="150" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="54" y="126" font-size="17" font-weight="700" fill="#111827">23 markets</text>
    <text x="54" y="148">NIFTY 50, Bank Nifty,</text>
    <text x="54" y="166">S&amp;P 500, DAX, Japan,</text>
    <text x="54" y="184">Hong Kong, China ...</text>
    <text x="54" y="208">most-traded home shares,</text>
    <text x="54" y="226">cross-listings removed</text>
    <rect x="38" y="262" width="204" height="120" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="54" y="290" font-size="17" font-weight="700" fill="#111827">5-minute bars</text>
    <text x="54" y="312">~60 days per stock,</text>
    <text x="54" y="330">cut at the scan time</text>
    <text x="54" y="348">for replays</text>
    <rect x="38" y="396" width="204" height="120" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="54" y="424" font-size="17" font-weight="700" fill="#111827">News and events</text>
    <text x="54" y="446">headlines per stock,</text>
    <text x="54" y="464">earnings dates,</text>
    <text x="54" y="482">macro backdrop</text>
    <rect x="38" y="530" width="204" height="72" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="54" y="558" font-size="17" font-weight="700" fill="#111827">Your settings</text>
    <text x="54" y="580">capital, intraday risk</text>
  </g>

  <line x1="262" y1="320" x2="292" y2="320" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Modes -->
  <rect x="296" y="20" width="300" height="290" rx="22" fill="#FFF1E6" stroke="#F97316" stroke-width="2.5"/>
  <text x="446" y="54" text-anchor="middle" font-size="20" font-weight="700" fill="#9A3412">Before the open</text>
  <text x="446" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#C2410C">odds of a BIG move today</text>
  <g font-size="13" fill="#431407">
    <text x="318" y="112">• in play yesterday: traded value and</text>
    <text x="330" y="130">range against the stock's normal</text>
    <text x="318" y="156">• calibrated on this market's recent</text>
    <text x="330" y="174">sessions, smoothed by decile</text>
    <text x="318" y="200">• direction only if it clears two</text>
    <text x="330" y="218">standard errors from 50%</text>
    <text x="318" y="244">• plan: two-sided opening-range</text>
    <text x="330" y="262">break after the first 15 minutes</text>
  </g>
  <rect x="316" y="276" width="260" height="24" rx="12" fill="#FED7AA"/>
  <text x="446" y="293" text-anchor="middle" font-size="12" font-weight="600" fill="#7C2D12">picks moved big 29-32% vs 17-22% (walk-forward)</text>

  <rect x="296" y="330" width="300" height="290" rx="22" fill="#E9F9EF" stroke="#22C55E" stroke-width="2.5"/>
  <text x="446" y="364" text-anchor="middle" font-size="20" font-weight="700" fill="#14532D">During the session</text>
  <text x="446" y="388" text-anchor="middle" font-size="14" font-weight="600" fill="#15803D">odds that momentum follows through</text>
  <g font-size="13" fill="#052E16">
    <text x="318" y="422">• relative volume for this time of day</text>
    <text x="318" y="446">• side of VWAP, move efficiency,</text>
    <text x="330" y="464">opening-range break, vs the index</text>
    <text x="318" y="490">• follow-through vs fade, from the same</text>
    <text x="330" y="508">time of day on past sessions</text>
    <text x="318" y="534">• trigger-based plan with stop,</text>
    <text x="330" y="552">targets and square-off time</text>
  </g>
  <rect x="316" y="586" width="260" height="24" rx="12" fill="#BBF7D0"/>
  <text x="446" y="603" text-anchor="middle" font-size="12" font-weight="600" fill="#14532D">says "no edge" and stands aside when true</text>

  <line x1="598" y1="165" x2="630" y2="290" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="598" y1="475" x2="630" y2="350" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Analysts -->
  <rect x="634" y="100" width="210" height="440" rx="22" fill="#EEF2FF" stroke="#8B9CF6" stroke-width="2.5"/>
  <text x="739" y="136" text-anchor="middle" font-size="20" font-weight="700" fill="#3730A3">Analysts</text>
  <text x="739" y="156" text-anchor="middle" font-size="13" fill="#3730A3">in parallel</text>
  <g font-size="13" fill="#374151">
    <rect x="652" y="172" width="174" height="108" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="739" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Tape</text>
    <text x="739" y="228" text-anchor="middle">grades A / B / C,</text>
    <text x="739" y="246" text-anchor="middle">daily trend and levels</text>
    <rect x="652" y="292" width="174" height="108" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="739" y="326" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Catalyst</text>
    <text x="739" y="348" text-anchor="middle">fresh, sector, none,</text>
    <text x="739" y="366" text-anchor="middle">or conflicting</text>
    <rect x="652" y="412" width="174" height="108" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="739" y="446" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Regime</text>
    <text x="739" y="468" text-anchor="middle">trend or range day,</text>
    <text x="739" y="486" text-anchor="middle">is momentum paying</text>
  </g>

  <line x1="846" y1="320" x2="872" y2="320" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Debate -->
  <rect x="876" y="20" width="240" height="600" rx="22" fill="#FDEBC8" stroke="#F0A500" stroke-width="2.5"/>
  <rect x="894" y="44" width="204" height="130" rx="16" fill="#E9FBE7" stroke="#86D98A" stroke-width="2"/>
  <text x="996" y="94" text-anchor="middle" font-size="22" font-weight="700" fill="#15803D">Advocate</text>
  <text x="996" y="122" text-anchor="middle" font-size="13" fill="#166534">up to three picks,</text>
  <text x="996" y="140" text-anchor="middle" font-size="13" fill="#166534">why they follow through</text>
  <line x1="966" y1="226" x2="966" y2="182" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1026" y1="182" x2="1026" y2="226" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="926" y="230" width="140" height="34" rx="17" fill="#FFF4DE" stroke="#B45309"/>
  <text x="996" y="253" text-anchor="middle" font-size="15" font-weight="600" fill="#78350F">Debate</text>
  <line x1="966" y1="314" x2="966" y2="270" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1026" y1="270" x2="1026" y2="314" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="894" y="318" width="204" height="130" rx="16" fill="#FDE8E8" stroke="#F19999" stroke-width="2"/>
  <text x="996" y="366" text-anchor="middle" font-size="22" font-weight="700" fill="#DC2626">Skeptic</text>
  <text x="996" y="394" text-anchor="middle" font-size="13" fill="#991B1B">why each move fails,</text>
  <text x="996" y="412" text-anchor="middle" font-size="13" fill="#991B1B">or why today is wrong</text>
  <rect x="894" y="462" width="204" height="106" rx="16" fill="#FFFFFF" stroke="#D1A15C" stroke-width="2"/>
  <text x="996" y="494" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Desk head</text>
  <text x="996" y="516" text-anchor="middle" font-size="13" fill="#374151">audits citations, picks</text>
  <text x="996" y="534" text-anchor="middle" font-size="13" fill="#374151">0 to 3 trades or 5 names,</text>
  <text x="996" y="552" text-anchor="middle" font-size="13" fill="#374151">odds moved ≤ 0.10</text>
  <path d="M876 580 h240 v18 a22 22 0 0 1 -22 22 h-196 a22 22 0 0 1 -22 -22 z" fill="#F0A500"/>
  <text x="996" y="607" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Intraday desk</text>

  <line x1="1118" y1="110" x2="1144" y2="110" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Right column -->
  <rect x="1148" y="40" width="232" height="120" rx="20" fill="#F3E8FF" stroke="#A855F7" stroke-width="2.5"/>
  <text x="1264" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Intraday trader</text>
  <text x="1264" y="104" text-anchor="middle" font-size="13" fill="#4C1D95">trigger, stop, targets,</text>
  <text x="1264" y="122" text-anchor="middle" font-size="13" fill="#4C1D95">size, square-off time;</text>
  <text x="1264" y="140" text-anchor="middle" font-size="13" fill="#4C1D95">fills only if triggered</text>

  <line x1="1264" y1="162" x2="1264" y2="182" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1148" y="186" width="232" height="132" rx="20" fill="#FFFFFF" stroke="#6B8AF0" stroke-width="2.5"/>
  <path d="M1148 206 a20 20 0 0 1 20 -20 h192 a20 20 0 0 1 20 20 v14 h-232 z" fill="#6B8AF0"/>
  <text x="1264" y="211" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Risk committee</text>
  <g font-size="15" fill="#111827">
    <rect x="1166" y="234" width="22" height="22" rx="6" fill="#F59E0B"/><text x="1198" y="251">Aggressive</text>
    <rect x="1166" y="262" width="22" height="22" rx="6" fill="#9CA3AF"/><text x="1198" y="279">Neutral</text>
    <rect x="1166" y="290" width="22" height="22" rx="6" fill="#3B82F6"/><text x="1198" y="307">Conservative</text>
  </g>

  <line x1="1264" y1="320" x2="1264" y2="340" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1148" y="344" width="232" height="84" rx="20" fill="#E8EEFF" stroke="#4F7BF7" stroke-width="2.5"/>
  <text x="1264" y="378" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Portfolio manager</text>
  <text x="1264" y="402" text-anchor="middle" font-size="13" fill="#1E3A8A">take, half size, or drop</text>

  <line x1="1264" y1="430" x2="1264" y2="448" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1148" y="452" width="232" height="72" rx="20" fill="#4F7BF7"/>
  <text x="1264" y="484" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">Today's picks</text>
  <text x="1264" y="506" text-anchor="middle" font-size="13" fill="#E0E7FF">or "no trade today"</text>

  <line x1="1264" y1="526" x2="1264" y2="542" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1148" y="546" width="232" height="74" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1264" y="574" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Journal, by the close</text>
  <text x="1264" y="596" text-anchor="middle" font-size="12" fill="#374151">triggered? stop or target first?</text>
  <text x="1264" y="612" text-anchor="middle" font-size="12" fill="#374151">R multiple on 5-minute bars</text>
</svg>
