<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="640" rx="24" fill="#FFFFFF"/>

  <!-- Data tools -->
  <rect x="20" y="20" width="280" height="600" rx="22" fill="#FFF4DE" stroke="#F5B942" stroke-width="2.5"/>
  <text x="160" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#92400E">Data tools (MCP)</text>
  <text x="160" y="78" text-anchor="middle" font-size="13" fill="#92400E">computed in code, point-in-time</text>
  <g font-size="13" fill="#374151">
    <rect x="40" y="96" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="58" y="124" font-size="17" font-weight="700" fill="#111827">Market</text>
    <text x="58" y="146">41 exchanges, Yahoo Finance</text>
    <text x="58" y="166">indicators, direction model</text>
    <rect x="40" y="198" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="58" y="226" font-size="17" font-weight="700" fill="#111827">Fundamentals</text>
    <text x="58" y="248">valuation, quarters, insiders</text>
    <text x="58" y="268">earnings date</text>
    <rect x="40" y="300" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="58" y="328" font-size="17" font-weight="700" fill="#111827">News</text>
    <text x="58" y="350">Google News, local edition</text>
    <text x="58" y="370">filtered to as_of</text>
    <rect x="40" y="402" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="58" y="430" font-size="17" font-weight="700" fill="#111827">Sentiment</text>
    <text x="58" y="452">analyst trend, short interest</text>
    <text x="58" y="472">options put/call</text>
    <rect x="40" y="504" width="240" height="92" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="58" y="532" font-size="17" font-weight="700" fill="#111827">Macro</text>
    <text x="58" y="554">benchmark, vol index, rates</text>
    <text x="58" y="574">FX, crude, gold</text>
  </g>

  <line x1="302" y1="320" x2="336" y2="320" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Analyst team -->
  <rect x="340" y="20" width="220" height="600" rx="22" fill="#EEF2FF" stroke="#8B9CF6" stroke-width="2.5"/>
  <text x="450" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#3730A3">Analyst team</text>
  <text x="450" y="78" text-anchor="middle" font-size="13" fill="#3730A3">in parallel, one report each</text>
  <g font-size="13" fill="#374151">
    <rect x="360" y="100" width="180" height="112" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="450" y="140" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Technical</text>
    <text x="450" y="162" text-anchor="middle">regime, levels,</text>
    <text x="450" y="180" text-anchor="middle">quant odds</text>
    <rect x="360" y="226" width="180" height="112" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="450" y="266" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Fundamentals</text>
    <text x="450" y="288" text-anchor="middle">event risk,</text>
    <text x="450" y="306" text-anchor="middle">value vs growth</text>
    <rect x="360" y="352" width="180" height="112" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="450" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">News and macro</text>
    <text x="450" y="414" text-anchor="middle">catalyst or noise,</text>
    <text x="450" y="432" text-anchor="middle">scheduled events</text>
    <rect x="360" y="478" width="180" height="112" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <text x="450" y="518" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Sentiment</text>
    <text x="450" y="540" text-anchor="middle">crowding, which way</text>
    <text x="450" y="558" text-anchor="middle">a surprise hurts</text>
  </g>

  <line x1="562" y1="320" x2="596" y2="320" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Research team -->
  <rect x="600" y="20" width="260" height="600" rx="22" fill="#FDEBC8" stroke="#F0A500" stroke-width="2.5"/>
  <rect x="620" y="44" width="220" height="140" rx="16" fill="#E9FBE7" stroke="#86D98A" stroke-width="2"/>
  <text x="730" y="92" text-anchor="middle" font-size="26" font-weight="700" fill="#15803D">Bull</text>
  <text x="730" y="122" text-anchor="middle" font-size="13" fill="#166534">strongest case up,</text>
  <text x="730" y="140" text-anchor="middle" font-size="13" fill="#166534">every number cited</text>
  <line x1="700" y1="236" x2="700" y2="192" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="192" x2="760" y2="236" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="648" y="240" width="164" height="36" rx="18" fill="#FFF4DE" stroke="#B45309"/>
  <text x="730" y="264" text-anchor="middle" font-size="15" font-weight="600" fill="#78350F">Debate, n rounds</text>
  <line x1="700" y1="328" x2="700" y2="284" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="284" x2="760" y2="328" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="620" y="332" width="220" height="130" rx="16" fill="#FDE8E8" stroke="#F19999" stroke-width="2"/>
  <text x="730" y="378" text-anchor="middle" font-size="26" font-weight="700" fill="#DC2626">Bear</text>
  <text x="730" y="408" text-anchor="middle" font-size="13" fill="#991B1B">strongest case down,</text>
  <text x="730" y="426" text-anchor="middle" font-size="13" fill="#991B1B">every number cited</text>
  <rect x="620" y="478" width="220" height="92" rx="16" fill="#FFFFFF" stroke="#D1A15C" stroke-width="2"/>
  <text x="730" y="506" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Research manager</text>
  <text x="730" y="528" text-anchor="middle" font-size="13" fill="#374151">strikes uncited claims,</text>
  <text x="730" y="546" text-anchor="middle" font-size="13" fill="#374151">moves quant odds ≤ 0.10</text>
  <path d="M600 580 h260 v18 a22 22 0 0 1 -22 22 h-216 a22 22 0 0 1 -22 -22 z" fill="#F0A500"/>
  <text x="730" y="607" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Research team</text>

  <!-- Research -> Trader -->
  <path d="M862 150 H 896" stroke="#16A34A" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="879" y="138" text-anchor="middle" font-size="12" fill="#15803D">plan</text>

  <!-- Trader -->
  <rect x="900" y="60" width="180" height="200" rx="20" fill="#F3E8FF" stroke="#A855F7" stroke-width="2.5"/>
  <circle cx="990" cy="112" r="24" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <path d="M960 162 a30 26 0 0 1 60 0" fill="none" stroke="#7C3AED" stroke-width="3"/>
  <text x="990" y="196" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Trader</text>
  <text x="990" y="218" text-anchor="middle" font-size="13" fill="#4C1D95">entry, ATR stop,</text>
  <text x="990" y="236" text-anchor="middle" font-size="13" fill="#4C1D95">targets, size</text>

  <line x1="1082" y1="150" x2="1106" y2="150" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Risk committee -->
  <rect x="1110" y="20" width="270" height="250" rx="22" fill="#FFFFFF" stroke="#6B8AF0" stroke-width="2.5"/>
  <path d="M1110 42 a22 22 0 0 1 22 -22 h226 a22 22 0 0 1 22 22 v22 h-270 z" fill="#6B8AF0"/>
  <text x="1245" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Risk committee</text>
  <g font-size="17" fill="#111827">
    <rect x="1134" y="84" width="40" height="40" rx="10" fill="#F59E0B"/>
    <circle cx="1154" cy="99" r="7" fill="#FFFFFF"/><path d="M1142 118 a12 10 0 0 1 24 0" fill="#FFFFFF"/>
    <text x="1188" y="110">Aggressive</text>
    <rect x="1134" y="140" width="40" height="40" rx="10" fill="#9CA3AF"/>
    <circle cx="1154" cy="155" r="7" fill="#FFFFFF"/><path d="M1142 174 a12 10 0 0 1 24 0" fill="#FFFFFF"/>
    <text x="1188" y="166">Neutral</text>
    <rect x="1134" y="196" width="40" height="40" rx="10" fill="#3B82F6"/>
    <circle cx="1154" cy="211" r="7" fill="#FFFFFF"/><path d="M1142 230 a12 10 0 0 1 24 0" fill="#FFFFFF"/>
    <text x="1188" y="222">Conservative</text>
  </g>

  <line x1="1245" y1="272" x2="1245" y2="298" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Portfolio manager -->
  <rect x="1110" y="302" width="270" height="100" rx="20" fill="#E8EEFF" stroke="#4F7BF7" stroke-width="2.5"/>
  <text x="1245" y="342" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">Portfolio manager</text>
  <text x="1245" y="366" text-anchor="middle" font-size="13" fill="#1E3A8A">final call, size multiplier,</text>
  <text x="1245" y="384" text-anchor="middle" font-size="13" fill="#1E3A8A">records it in the journal</text>

  <path d="M1245 404 V 424 H 1140 V 436" stroke="#6B7280" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Decision -->
  <rect x="900" y="440" width="480" height="88" rx="20" fill="#4F7BF7"/>
  <text x="1140" y="476" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Decision</text>
  <text x="1140" y="504" text-anchor="middle" font-size="14" fill="#E0E7FF">direction, p(up / down / flat), 80% range, rating, sized plan</text>

  <line x1="1140" y1="530" x2="1140" y2="548" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Journal -->
  <rect x="900" y="552" width="480" height="68" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1140" y="582" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Journal: graded after the horizon</text>
  <text x="1140" y="604" text-anchor="middle" font-size="13" fill="#374151">hit rate and Brier score against the base rate: skill or luck</text>

</svg>
