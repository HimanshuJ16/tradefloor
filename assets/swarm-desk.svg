<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="640" rx="24" fill="#FFFFFF"/>

  <!-- Seed -->
  <rect x="20" y="20" width="250" height="600" rx="22" fill="#FFF4DE" stroke="#F5B942" stroke-width="2.5"/>
  <text x="145" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#92400E">Seed</text>
  <text x="145" y="78" text-anchor="middle" font-size="13" fill="#92400E">what the crowd reacts to</text>
  <g font-size="13" fill="#374151">
    <rect x="38" y="96" width="214" height="80" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="54" y="124" font-size="16" font-weight="700" fill="#111827">News and filings</text>
    <text x="54" y="146">dated, sourced, numbered</text>
    <text x="54" y="164">E1, E2, E3 ...</text>
    <rect x="38" y="188" width="214" height="80" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="54" y="216" font-size="16" font-weight="700" fill="#111827">Already in the price</text>
    <text x="54" y="238">last week and month,</text>
    <text x="54" y="256">trend and levels</text>
    <rect x="38" y="280" width="214" height="80" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="54" y="308" font-size="16" font-weight="700" fill="#111827">Backdrop</text>
    <text x="54" y="330">rates, currency, crude,</text>
    <text x="54" y="348">volatility index</text>
    <rect x="38" y="372" width="214" height="80" rx="14" fill="#FFFFFF" stroke="#F5D08A"/>
    <text x="54" y="400" font-size="16" font-weight="700" fill="#111827">Scheduled events</text>
    <text x="54" y="422">results, central bank,</text>
    <text x="54" y="440">index changes</text>
  </g>
  <rect x="38" y="470" width="214" height="132" rx="14" fill="#FFF1E6" stroke="#EA580C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="145" y="498" text-anchor="middle" font-size="16" font-weight="700" fill="#9A3412">What-if</text>
  <text x="145" y="520" text-anchor="middle" font-size="13" fill="#7C2D12">inject an event:</text>
  <text x="145" y="540" text-anchor="middle" font-size="13" font-style="italic" fill="#7C2D12">"the RBI raises the</text>
  <text x="145" y="558" text-anchor="middle" font-size="13" font-style="italic" fill="#7C2D12">repo rate by 25 bp"</text>
  <text x="145" y="584" text-anchor="middle" font-size="12" fill="#9A3412">personas react again</text>

  <line x1="272" y1="300" x2="302" y2="300" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M254 536 H 290 V 560 H 302" stroke="#EA580C" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowOrange)"/>

  <!-- Personas -->
  <rect x="306" y="20" width="330" height="600" rx="22" fill="#F3E8FF" stroke="#A855F7" stroke-width="2.5"/>
  <text x="471" y="56" text-anchor="middle" font-size="21" font-weight="700" fill="#581C87">Personas, in parallel</text>
  <text x="471" y="78" text-anchor="middle" font-size="13" fill="#581C87">one LLM agent per participant group</text>
  <g font-size="13">
    <!-- each row: name, then a sentiment bar from -1 to +1 -->
    <rect x="324" y="96" width="294" height="76" rx="14" fill="#FFFFFF" stroke="#D8B4FE"/>
    <text x="340" y="122" font-size="15" font-weight="700" fill="#111827">Foreign institutions</text>
    <text x="340" y="142" fill="#6B21A8">sell: yields up, rupee weak</text>
    <line x1="340" y1="158" x2="600" y2="158" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="470" y1="158" x2="398" y2="158" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
    <rect x="324" y="182" width="294" height="76" rx="14" fill="#FFFFFF" stroke="#D8B4FE"/>
    <text x="340" y="208" font-size="15" font-weight="700" fill="#111827">Domestic funds</text>
    <text x="340" y="228" fill="#6B21A8">buy the dip, SIP inflows</text>
    <line x1="340" y1="244" x2="600" y2="244" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="470" y1="244" x2="540" y2="244" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>
    <rect x="324" y="268" width="294" height="76" rx="14" fill="#FFFFFF" stroke="#D8B4FE"/>
    <text x="340" y="294" font-size="15" font-weight="700" fill="#111827">Retail</text>
    <text x="340" y="314" fill="#6B21A8">chase the headline</text>
    <line x1="340" y1="330" x2="600" y2="330" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="470" y1="330" x2="430" y2="330" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
    <rect x="324" y="354" width="294" height="76" rx="14" fill="#FFFFFF" stroke="#D8B4FE"/>
    <text x="340" y="380" font-size="15" font-weight="700" fill="#111827">Prop and algo desks</text>
    <text x="340" y="400" fill="#6B21A8">trade the first move</text>
    <line x1="340" y1="416" x2="600" y2="416" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="470" y1="416" x2="448" y2="416" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
    <rect x="324" y="440" width="294" height="76" rx="14" fill="#FFFFFF" stroke="#D8B4FE"/>
    <text x="340" y="466" font-size="15" font-weight="700" fill="#111827">Market makers</text>
    <text x="340" y="486" fill="#6B21A8">lean against the move</text>
    <line x1="340" y1="502" x2="600" y2="502" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="470" y1="502" x2="484" y2="502" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>
    <rect x="324" y="526" width="294" height="76" rx="14" fill="#FFFFFF" stroke="#D8B4FE"/>
    <text x="340" y="552" font-size="15" font-weight="700" fill="#111827">Event funds</text>
    <text x="340" y="572" fill="#6B21A8">trade the catalyst</text>
    <line x1="340" y1="588" x2="600" y2="588" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="470" y1="588" x2="420" y2="588" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  </g>

  <line x1="638" y1="300" x2="668" y2="300" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Simulator -->
  <rect x="672" y="60" width="330" height="480" rx="22" fill="#E8EEFF" stroke="#4F7BF7" stroke-width="2.5"/>
  <text x="837" y="98" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A8A">Market swarm</text>
  <text x="837" y="120" text-anchor="middle" font-size="13" fill="#1E3A8A">computed in code, same seed, same answer</text>
  <!-- swarm of dots -->
  <g fill-opacity="0.85">
    <circle cx="712" cy="160" r="5" fill="#DC2626"/><circle cx="731" cy="176" r="5" fill="#16A34A"/><circle cx="752" cy="152" r="5" fill="#9CA3AF"/>
    <circle cx="774" cy="170" r="5" fill="#DC2626"/><circle cx="796" cy="156" r="5" fill="#16A34A"/><circle cx="818" cy="178" r="5" fill="#16A34A"/>
    <circle cx="840" cy="150" r="5" fill="#DC2626"/><circle cx="862" cy="172" r="5" fill="#9CA3AF"/><circle cx="884" cy="158" r="5" fill="#16A34A"/>
    <circle cx="906" cy="176" r="5" fill="#DC2626"/><circle cx="928" cy="154" r="5" fill="#9CA3AF"/><circle cx="950" cy="170" r="5" fill="#16A34A"/>
    <circle cx="968" cy="152" r="5" fill="#DC2626"/><circle cx="722" cy="196" r="5" fill="#9CA3AF"/><circle cx="744" cy="206" r="5" fill="#DC2626"/>
    <circle cx="766" cy="192" r="5" fill="#16A34A"/><circle cx="788" cy="204" r="5" fill="#DC2626"/><circle cx="810" cy="196" r="5" fill="#9CA3AF"/>
    <circle cx="832" cy="208" r="5" fill="#16A34A"/><circle cx="854" cy="194" r="5" fill="#DC2626"/><circle cx="876" cy="206" r="5" fill="#16A34A"/>
    <circle cx="898" cy="196" r="5" fill="#DC2626"/><circle cx="920" cy="208" r="5" fill="#16A34A"/><circle cx="942" cy="192" r="5" fill="#9CA3AF"/>
    <circle cx="962" cy="204" r="5" fill="#DC2626"/>
  </g>
  <g font-size="14" fill="#111827">
    <text x="700" y="252" font-weight="700">2,000 simulated traders</text>
    <text x="700" y="274" fill="#374151">fundamental, trend, contrarian and</text>
    <text x="700" y="292" fill="#374151">news-driven, each with its own strength</text>
    <text x="700" y="324" font-weight="700">1,000 Monte Carlo worlds</text>
    <text x="700" y="346" fill="#374151">calibrated to the stock's own</text>
    <text x="700" y="364" fill="#374151">volatility, tails and normal drift</text>
    <text x="700" y="396" font-weight="700">Baseline vs scenario</text>
    <text x="700" y="418" fill="#374151">normal behaviour, then with the</text>
    <text x="700" y="436" fill="#374151">crowd's reactions: the shift is the news</text>
  </g>
  <rect x="696" y="460" width="282" height="60" rx="14" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="837" y="486" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">baseline 80% range held 78% of real</text>
  <text x="837" y="505" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">1-month outcomes (NIFTY, 168 cases)</text>

  <line x1="1004" y1="300" x2="1034" y2="300" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Report -->
  <rect x="1038" y="20" width="342" height="360" rx="22" fill="#FFFFFF" stroke="#6B8AF0" stroke-width="2.5"/>
  <path d="M1038 42 a22 22 0 0 1 22 -22 h298 a22 22 0 0 1 22 22 v24 h-342 z" fill="#6B8AF0"/>
  <text x="1209" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">Swarm report</text>
  <g font-size="14" fill="#111827">
    <text x="1060" y="96" font-weight="700">Odds, three ways</text>
    <text x="1060" y="118" fill="#374151">normal behaviour · with the crowd ·</text>
    <text x="1060" y="136" fill="#374151">quant model · what-if</text>
    <text x="1060" y="170" font-weight="700">Fan of outcomes</text>
    <text x="1060" y="192" fill="#374151">10th, 50th, 90th percentile by day</text>
    <text x="1060" y="226" font-weight="700">Who moved the price</text>
    <text x="1060" y="248" fill="#374151">each group's push, in percent</text>
    <rect x="1060" y="262" width="120" height="12" rx="3" fill="#16A34A"/><text x="1188" y="273" font-size="12" fill="#374151">domestic funds</text>
    <rect x="1060" y="282" width="84" height="12" rx="3" fill="#DC2626"/><text x="1152" y="293" font-size="12" fill="#374151">foreign institutions</text>
    <rect x="1060" y="302" width="36" height="12" rx="3" fill="#DC2626"/><text x="1104" y="313" font-size="12" fill="#374151">retail</text>
    <text x="1060" y="350" font-weight="700">Ask any group why</text>
    <text x="1060" y="370" fill="#374151" font-size="13">the persona answers in character</text>
  </g>

  <line x1="1209" y1="382" x2="1209" y2="410" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1038" y="414" width="342" height="92" rx="20" fill="#4F7BF7"/>
  <text x="1209" y="450" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">The call</text>
  <text x="1209" y="476" text-anchor="middle" font-size="13" fill="#E0E7FF">direction and odds from the scenario;</text>
  <text x="1209" y="494" text-anchor="middle" font-size="13" fill="#E0E7FF">what-ifs are hypothetical, never recorded</text>

  <line x1="1209" y1="508" x2="1209" y2="530" stroke="#6B7280" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1038" y="534" width="342" height="86" rx="18" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1209" y="566" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Journal, source "swarm"</text>
  <text x="1209" y="588" text-anchor="middle" font-size="12" fill="#374151">graded after the horizon against the</text>
  <text x="1209" y="606" text-anchor="middle" font-size="12" fill="#374151">quant model: does the crowd add skill?</text>
</svg>
