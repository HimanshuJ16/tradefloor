[project]
name = "tradefloor"
version = "0.4.0"
description = "Financial research desk and reproducible scenario lab: deterministic analytics, evidence, replay and forecast evaluation."
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Himanshu Jangir" }]
keywords = ["trading", "stocks", "multi-agent", "llm", "mcp", "claude-code", "intraday", "nse", "calibration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=2.2,<3",
  "yfinance>=0.2.54",
  "pandas>=2.1",
  "numpy>=1.26",
  "exchange-calendars>=4.5,<5",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
]

[project.urls]
Homepage = "https://github.com/HimanshuJ16/tradefloor"
Issues = "https://github.com/HimanshuJ16/tradefloor/issues"

[project.scripts]
tradefloor-mcp = "tradefloor.server:main"
tradefloor = "tradefloor.cli:main"
tradefloor-demo = "tradefloor.demo:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradefloor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
