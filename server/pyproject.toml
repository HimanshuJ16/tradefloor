[project]
name = "tradefloor"
version = "0.1.1"
description = "Multi-agent market analysis for any exchange: MCP server with deterministic, point-in-time analytics."
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Himanshu Jangir" }]
keywords = ["trading", "stocks", "multi-agent", "llm", "mcp", "claude-code", "intraday", "nse", "calibration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=2.2,<3",
  "yfinance>=0.2.54",
  "pandas>=2.1",
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/HimanshuJ16/tradefloor"
Issues = "https://github.com/HimanshuJ16/tradefloor/issues"

[project.scripts]
tradefloor-mcp = "tradefloor.server:main"
tradefloor = "tradefloor.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradefloor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
